<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fitness Club — фитнес и тренировки</title>

    <meta name="description" content="Fitness Club — тренировки, расписание, персональные тренеры и запись онлайн. Современный фитнес-клуб.">

    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="css/main.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
</head>
<body>

<div class="top-bar">
    <div class="container">
        <div class="top-info">

            <div class="address">
                 Нижний Новгород, пр. Гагарина, 35
            </div>

            <div class="phone">
                 8 (831) 2-172-172
            </div>

            <div class="worktime">
                Пн-Пт 6:30-23:00
            </div>

        </div>
    </div>
</div>

<header class="main-header">

    <div class="container header-inner">

        <div class="logo"><a href="#home">Fitness Club</a></div>

        <nav>
            <ul>
                <li><a href="#prices">Цены</a></li>
                <li><a href="#schedule">Расписание</a></li>
                <li><a href="#trainers">Тренеры</a></li>
                <li><a href="#contacts">Контакты</a></li>
                <!-- <li><a href="#login">Вход</a></li> -->
                <!-- <li><a href="#admin">Админ</a></li> -->
                <!-- <li><a href="#" id="logout-link">Выйти</a></li> -->
            </ul>
        </nav>

        <button class="guest-btn" id="guest-btn">
            Гостевой визит
        </button>

    </div>
</header>

<main>
    <div class="container">
        <section id="home" class="page active">

            <h1>ФИТНЕС-КЛУБ<br>ПРЕМИУМ КЛАССА</h1>

            <!-- СЛАЙДЕР -->
            <div class="hero-slider swiper">

                <div class="swiper-wrapper">

                    <!-- Слайд 1 -->
                    <div class="swiper-slide">
                        <div class="slide-card">
                        <img src="assets/images/main.jpg" alt="Приветственное фото">
                        </div>
                    </div>

                    <!-- Слайд 2 -->
                    <div class="swiper-slide">
                        <div class="slide-card">
                        <img src="assets/images/main term.jpg" alt="Приветственное фото 2">
                        </div>
                    </div>
                </div>

                <!-- ТОЧКИ -->
                <div class="swiper-pagination"></div>

    </div>

        </section>

            <section id="prices" class="page"></section>
            <section id="schedule" class="page"></section>
            <section id="trainers" class="page">
            <h1>Тренеры</h1>
            <div id="trainers-list"></div>
            </section>
            <section id="contacts" class="page"></section>

            <section id="login" class="page"></section>
            <section id="admin" class="page"></section>
    </div>


    
</main>


<div class="modal" id="guest-modal">

  <div class="modal-content">

    <div class="modal-close" id="modal-close">✕</div>

    <h2>Гостевой визит</h2>

    <form id="guest-form">

        <input type="text" placeholder="Ваше имя" required>

        <input type="tel" placeholder="+7 (___) ___-__-__" required>

        <button type="submit">Записаться</button>

    </form>

  </div>

</div>

<footer>
    <div class="container">
    <p>© Fitness Club</p>
    </div>
</footer>


<script src="js/data.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

</body>
</html>
